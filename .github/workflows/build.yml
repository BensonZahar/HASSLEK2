name: build-konstt

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'key/**']      # правка списка ключей не должна пересобирать бандл

permissions:
  contents: write          # нужно, чтобы опубликовать ветку dist

concurrency:
  group: build-konstt
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Find or install NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            NDK=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            yes | "$SDK"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
            "$SDK"/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
            NDK="$SDK/ndk/27.2.12479018"
          fi
          echo "NDK=$NDK"
          echo "NDK_PATH=$NDK" >> "$GITHUB_ENV"

      - name: Quick compile check (host gcc)
        run: python3 build_konstt.py --check

      - name: Build bundle + loader (arm64 + arm32)
        run: python3 build_konstt.py "$NDK_PATH" --out out

      - name: Upload loader .so (вшивается в APK один раз)
        uses: actions/upload-artifact@v4
        with:
          name: konstt-so
          path: out/libkonstt_loader_*.so

      - name: Publish bundle to branch dist (его качает игра)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf dist_pub && mkdir dist_pub
          cp out/libkonstt_mods_arm64.so out/libkonstt_mods_arm32.so out/manifest.txt dist_pub/
          cd dist_pub
          git init -q -b dist
          git config user.name  "build-konstt"
          git config user.email "build-konstt@users.noreply.github.com"
          git add -A
          git commit -q -m "bundle $(sed -n 's/^build //p' manifest.txt)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin dist
